[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rhythm-server"
version = "0.1.0"
description = "Local analysis and chart generation server for Generative Rhythm Game"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile>=0.12",
  "av>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# desktop packaging (packaging/build_desktop.sh)
build = ["pyinstaller>=6.10"]
# Optional ML analysis backends. Install PyTorch for your machine first (CPU build:
# pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu), then this extra.
# basic-pitch needs TensorFlow (< 2.15.1, no wheels past Python 3.11) only up to 3.11; from 3.12 on
# it runs its ONNX model with onnxruntime (the desktop ML edition, docs/ARCHITECTURE.md).
ml = ["demucs>=4.1", "beat-this>=1.0", "basic-pitch>=0.4", "onnxruntime>=1.17; python_version >= '3.12'"]

[project.scripts]
rhythm-server = "rhythm_server.__main__:main"

[tool.setuptools.packages.find]
include = ["rhythm_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running performance checks"]
