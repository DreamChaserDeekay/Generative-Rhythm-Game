[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rhythm-server"
version = "0.1.0"
description = "Local analysis and chart generation server for Generative Rhythm Game"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile>=0.12",
  "av>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rhythm-server = "rhythm_server.__main__:main"

[tool.setuptools.packages.find]
include = ["rhythm_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running performance checks"]
