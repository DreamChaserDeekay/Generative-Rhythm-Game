name: Stars probe

# Mapperatorinator (v32, on the runner's CPU) on a few CC BY songs (design-mockups/_src/music/manifest.json)
# at a list of star ratings, the way the server makes a song's charts (the first finds the timing,
# the others are given it). The level the app measures of each (rhythm_server.difficulty.estimator)
# against the stars asked for: what config/mapper.json starsForLevel is fitted to and how far a
# chart's level strays from it (docs/MAPPERATORINATOR.md, "난이도 구간에 맞추기"). Only the report
# (numbers) and the raw .osu files stay in the run's artifacts; nothing is committed.
on:
  workflow_dispatch:
  push:
    branches: [claude/tiers-v2]
    paths:
      - '.github/workflows/stars-probe.yml'

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        mode: [4K, 6K, 8K]
        song:
          - newer_wave.mp3
          - the_cannery.mp3
          - raving_energy_faster.mp3
    name: ${{ matrix.mode }} ${{ matrix.song }}
    runs-on: windows-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    env:
      GRG_MAPPER_ALLOW_CPU: '1'
      GRG_MAPPER_MODEL: v32
      SONG: ${{ matrix.song }}
      MODE: ${{ matrix.mode }}
      # star ratings, each a chart (a repeat is another seed)
      STARS: 2.8 0.8 1.3 1.8 2.8 4.5 7.5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install the server
        run: |
          python -m pip install -e ./server
          echo "GRG_MAPPER_HOME=$RUNNER_TEMP/grg-mapper" >> "$GITHUB_ENV"
      - name: Fetch the song
        run: |
          url=$(python -c "import json, os; print(next(s['download_url'] for s in json.load(open('design-mockups/_src/music/manifest.json', encoding='utf-8')) if s['file'] == os.environ['SONG']))" | tr -d '\r')
          mkdir -p "$RUNNER_TEMP/song"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/song/$SONG" "$url"
          ls -la "$RUNNER_TEMP/song"
      - name: Set the runtime up
        working-directory: server
        run: python -m rhythm_server mapper setup
      - name: A chart at each star rating
        working-directory: server
        run: |
          status=0
          AUDIO="$RUNNER_TEMP/song/$SONG" OUT="$RUNNER_TEMP/probe" python - <<'EOF' || status=$?
          # One song in one key mode at each tier of TIERS, the way the server makes a song's charts
          # (rhythm_server/mapper/__init__.py): the first chart finds the timing, the others are given it;
          # the model stops at the music's end. Keeps the raw .osu files and a report.
          import json
          import os
          import sys
          import tempfile
          import time
          from pathlib import Path

          import soundfile as sf

          from rhythm_server import audio_io
          from rhythm_server.chart.keysounds import default_seed
          from rhythm_server.formats.osu import parse_osu
          from rhythm_server.mapper import Mapper, charts
          from rhythm_server.mapper.silence import music_end, quiet_spans

          src, out, mode = Path(os.environ["AUDIO"]), Path(os.environ["OUT"]), os.environ["MODE"]
          out.mkdir(parents=True, exist_ok=True)
          mapper = Mapper()
          if not mapper.active():
              sys.exit("Mapperatorinator is not set up: " + json.dumps(mapper.runtime.status(), ensure_ascii=False, default=str))
          cfg = mapper.config()
          pcm = audio_io.decode_audio(src)
          duration = len(pcm) * 1000.0 / 44100
          quiet = quiet_spans(pcm, 44100, cfg["silence"])
          end = music_end(quiet, duration)
          audio_hash = "sha256:" + audio_io.file_sha256(src)
          report = {"audio": src.name, "seconds": round(duration / 1000, 1), "model": cfg.get("model"), "mode": mode, "quiet": quiet,
                    "musicEndMs": end, "runs": {}}
          timing = None
          try:
              with tempfile.TemporaryDirectory() as tmp:
                  wav = Path(tmp) / "song.wav"
                  sf.write(wav, pcm, 44100, subtype="PCM_16")
                  from rhythm_server.chart.tempo import TempoMap
                  from rhythm_server.config import key_modes
                  from rhythm_server.difficulty.estimator import estimate
                  from rhythm_server.difficulty.tiers import resolve_tier
                  from rhythm_server.formats.common import normalize_notes
                  stars_list = [float(s) for s in os.environ["STARS"].split()]
                  for k, stars in enumerate(stars_list):
                      tier = f"S{stars:g}-{stars_list[:k].count(stars)}"
                      seed = default_seed(audio_hash, mode, tier, None)
                      made = Path(tmp) / tier
                      made.mkdir()
                      beatmap = None
                      if timing is not None:
                          beatmap = Path(tmp) / f"timing-{tier}.osu"
                          beatmap.write_text(charts.timing_osu(timing, len(charts.columns(mode)), wav.name, src.stem), encoding="utf-8")
                      request = charts.request_for(mode, 1, seed, cfg, wav, made, beatmap, {"title": src.stem}, end)
                      request["difficulty"] = stars
                      t = time.time()
                      try:
                          answer = mapper.service.generate(request, 3 * 3600.0)
                          text = Path(answer["osu"]).read_text(encoding="utf-8-sig")
                          (out / f"{src.stem}.{mode}.{tier}.osu").write_text(text, encoding="utf-8")
                          if timing is None:
                              timing = parse_osu(text).timing
                          lanes = charts.columns(mode)
                          notes = normalize_notes(charts.notes_from_osu(text, lanes), TempoMap(parse_osu(text).timing))
                          p = resolve_tier(mode, os.environ.get("TIER_FOR_TABLE", "HARD"))
                          est = estimate(notes, mode, len(key_modes()[mode]["lanes"]), duration, p.min_jack_ms, p.level_table, p.level_factor)
                          report["runs"][tier] = {
                              "ok": True, "stars": stars, "measuredLevel": est["level"], "rating": float(est["rating"]),
                              "effectiveNps": est["effectiveNps"], "seed": seed, "seconds": round(time.time() - t, 1),
                              "worker": answer.get("seconds"), "timing": "song" if beatmap else "model", "endTime": request["endTime"],
                              "notes": len(charts.notes_from_osu(text, charts.columns(mode))), "device": answer.get("device"),
                              "precision": answer.get("precision"),
                          }
                      except Exception as e:  # noqa: BLE001  (the other tiers still count)
                          report["runs"][tier] = {"ok": False, "stars": stars, "seconds": round(time.time() - t, 1), "error": str(e)}
                      print(json.dumps({tier: report["runs"][tier]}, ensure_ascii=False), file=sys.stderr, flush=True)
          finally:
              mapper.close()
          (out / f"{src.stem}.{mode}.json").write_text(json.dumps(report, ensure_ascii=False, indent=1), encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False))
          if not any(r.get("ok") for r in report["runs"].values()):
              sys.exit(1)
          EOF
          cp "$GRG_MAPPER_HOME/worker.log" "$RUNNER_TEMP/probe/worker-$MODE-${SONG%.mp3}.log" 2>/dev/null || true
          exit $status
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: stars-probe-${{ matrix.mode }}-${{ matrix.song }}
          path: ${{ runner.temp }}/probe
          if-no-files-found: warn
          retention-days: 30
