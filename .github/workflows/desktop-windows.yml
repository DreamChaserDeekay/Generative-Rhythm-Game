name: Desktop app (Windows)

# Builds the Windows installers: the client, the analysis server bundled with PyInstaller (it has to
# run on Windows to produce a Windows executable), then the Electron NSIS installer. Each installer is
# then installed silently and the installed app is launched once as a smoke test. Editions: core
# (the core analysis only), ml (PyTorch CPU, Demucs, beat_this, basic-pitch ONNX; a 347 MB
# installer; packaging/ml_torch.txt pins PyTorch) and, on develop and manual runs, structure (the ml
# edition plus allin1 for the song structure, on Python 3.11 and PyTorch 2.1 with NATTEN built from
# source; packaging/structure_constraints.txt, docs/PATTERN_DESIGN.md 90).
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'client/e2e/**'
      - '**/*.test.ts'
      - 'server/tests/**'

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON((github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch') && '["core", "ml", "structure"]' || '["core", "ml"]') }}
    name: windows (${{ matrix.edition }})
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GRG_EDITION: ${{ matrix.edition }}
      SETUP_PREFIX: ${{ matrix.edition == 'structure' && 'GenerativeRhythm-ML-Structure-Setup' || matrix.edition == 'ml' && 'GenerativeRhythm-ML-Setup' || 'GenerativeRhythm-Setup' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # allin1's NATTEN builds against PyTorch 2.1, which has no Python 3.12 wheels
          python-version: ${{ matrix.edition == 'structure' && '3.11' || '3.12' }}
          cache: pip
          cache-dependency-path: server/pyproject.toml

      # NATTEN and madmom are built from source for the structure edition
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.edition == 'structure'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json

      - name: Build the client
        working-directory: client
        run: |
          npm ci
          npm run build

      # Mapperatorinator's source and slider's (its .osu parser) at the commits config/mapper.json
      # pins, bundled so the app sets its runtime up without GitHub (docs/MAPPERATORINATOR.md)
      - name: Fetch Mapperatorinator's source
        run: |
          read -r src slider < <(python -c "import json; r = json.load(open('config/mapper.json'))['runtime']; print(r['source']['commit'], r['slider']['commit'])")
          for spec in "mapperatorinator OliBomby/Mapperatorinator $src" "slider OliBomby/slider $slider"; do
            set -- $spec
            git init -q "packaging/vendor/$1"
            git -C "packaging/vendor/$1" fetch -q --depth 1 "https://github.com/$2.git" "$3"
            git -C "packaging/vendor/$1" checkout -q FETCH_HEAD
          done
          rm -rf packaging/vendor/mapperatorinator/.git packaging/vendor/slider/.git
          du -sh packaging/vendor/*

      - name: Bundle the analysis server (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          if [ "$GRG_EDITION" = ml ]; then
            python -m pip install -r packaging/ml_torch.txt --index-url https://download.pytorch.org/whl/cpu
            python -m pip install -e "./server[build,ml]"
            # its ONNX model on Python 3.12; its declared TensorFlow has no 3.12 wheels (server/pyproject.toml)
            python -m pip install --no-deps "basic-pitch>=0.4"
          elif [ "$GRG_EDITION" = structure ]; then
            # every install keeps PyTorch 2.1.2, torchaudio 2.1.2 and numpy 1 (NATTEN's build is tied to them)
            export PIP_CONSTRAINT="$PWD/packaging/structure_constraints.txt"
            # torch 2.1's extension builder imports pkg_resources, which new setuptools no longer ships
            python -m pip install "setuptools<70" wheel
            python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
            python -m pip install numpy cython ninja cmake
            bash packaging/build_natten.sh
            # madmom's PyPI release (0.16.1) predates numpy 1.24; allin1 needs the current source
            export PATH="$(dirname "$(command -v cl)"):$PATH"
            python -m pip install --no-build-isolation "git+https://github.com/CPJKU/madmom"
            # the ml extra's packages one by one: on Python 3.11 it would bring basic-pitch's TensorFlow
            python -m pip install -e "./server[build]" "demucs>=4.1" "beat-this>=1.0" "onnxruntime-directml>=1.17" "onnx>=1.16" "librosa>=0.10" \
              "mir-eval>=0.6" "pretty-midi>=0.2.9" "resampy>=0.2.2,<0.4.3" scikit-learn allin1
            python -m pip install --no-deps "basic-pitch>=0.4"
            python -m pip list 2>/dev/null | grep -iE "^(torch|torchaudio|natten|madmom|allin1|demucs|beat.this|basic.pitch|numpy|onnxruntime.*|onnx|matplotlib) " || true
          else
            python -m pip install -e "./server[build]"
          fi
          cd server
          python -m PyInstaller ../packaging/rhythm-server.spec --noconfirm --distpath dist --workpath build
          du -sh dist/rhythm-server

      - name: Smoke test the bundled server
        shell: pwsh
        run: |
          if ($env:GRG_EDITION -eq 'structure') { ./packaging/smoke_server.ps1 -ExpectML -ExpectStructure }
          elseif ($env:GRG_EDITION -eq 'ml') { ./packaging/smoke_server.ps1 -ExpectML }
          else { ./packaging/smoke_server.ps1 }

      # Mapperatorinator end to end on this runner's CPU (it has no GPU) with the small model: the
      # runtime's setup (uv, Python 3.11, CPU PyTorch, its packages, the weights) and one chart of a
      # 20-second synthetic song. Informational: the app runs it on an NVIDIA GPU (docs/MAPPERATORINATOR.md)
      - name: Mapperatorinator on the CPU (setup and one chart)
        if: matrix.edition == 'core'
        continue-on-error: true
        timeout-minutes: 60
        env:
          GRG_MAPPER_ALLOW_CPU: '1'
          GRG_MAPPER_MODEL: v32-mini
          GRG_MAPPER_HOME: ${{ runner.temp }}/grg-mapper
        run: |
          exe=server/dist/rhythm-server/rhythm-server.exe
          "$exe" mapper status
          ok=0
          "$exe" mapper setup && "$exe" mapper generate --seconds 20 --mode 7K+1S --difficulty HARD && ok=1
          mkdir -p "$RUNNER_TEMP/grg-smoke"
          cp "$GRG_MAPPER_HOME/setup.log" "$GRG_MAPPER_HOME/worker.log" "$RUNNER_TEMP/grg-smoke/" 2>/dev/null || true
          if [ "$ok" != 1 ]; then tail -n 80 "$GRG_MAPPER_HOME/setup.log" "$GRG_MAPPER_HOME/worker.log" 2>/dev/null; exit 1; fi

      # how long a 4-minute song takes with allin1 (its weights came with the smoke test); informational
      - name: Time a 4-minute song's analysis
        if: matrix.edition == 'structure'
        continue-on-error: true
        timeout-minutes: 75
        run: python packaging/time_analysis.py server/dist/rhythm-server/rhythm-server.exe "$RUNNER_TEMP/grg-timing"

      - name: Build the installer (electron-builder, NSIS)
        working-directory: desktop
        run: |
          npm ci
          # its tools and Electron from GitHub's release downloads, retried (one failed download fails the build)
          bash ../packaging/fetch_builder_tools.sh
          npx electron-builder --win nsis --x64 --publish never "-c.nsis.artifactName=${SETUP_PREFIX}-\${version}.\${ext}"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.edition == 'structure' && 'GenerativeRhythm-Windows-ML-Structure-Setup' || matrix.edition == 'ml' && 'GenerativeRhythm-Windows-ML-Setup' || 'GenerativeRhythm-Windows-Setup' }}
          path: desktop/dist/${{ env.SETUP_PREFIX }}-*.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Install silently and launch the installed app
        shell: pwsh
        env:
          # the app's 90-second demo song: allin1 takes about 2.2 times the song's length on this runner
          GRG_SMOKE_ANALYSIS_MS: ${{ matrix.edition == 'structure' && '900000' || '180000' }}
        run: |
          $setup = Get-ChildItem "desktop/dist/$($env:SETUP_PREFIX)-*.exe" | Select-Object -First 1
          Write-Host "installer: $($setup.Name) ($([math]::Round($setup.Length / 1MB)) MB)"
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "the installer exited with $($install.ExitCode)" }
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'Generative Rhythm.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'the installed app was not found under %LOCALAPPDATA%\Programs' }
          Write-Host "installed: $($exe.FullName)"
          node packaging/smoke_desktop.cjs client $exe.FullName desktop/dist/smoke

      - name: Collect the logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/dist/smoke | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'grg-smoke/*.log') desktop/dist/smoke -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $env:RUNNER_TEMP 'grg-timing/*.log') desktop/dist/smoke -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $env:APPDATA 'Generative Rhythm/server.log') desktop/dist/smoke/desktop-server.log -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: windows-smoke-test-${{ matrix.edition }}
          path: desktop/dist/smoke
          if-no-files-found: ignore
          retention-days: 30
