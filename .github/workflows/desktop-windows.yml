name: Desktop app (Windows)

# Builds the Windows installer: the client, the analysis server bundled with PyInstaller (it has to
# run on Windows to produce a Windows executable), then the Electron NSIS installer. The installer is
# then installed silently and the installed app is launched once as a smoke test.
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'client/e2e/**'
      - '**/*.test.ts'
      - 'server/tests/**'

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json

      - name: Build the client
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Bundle the analysis server (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./server[build]"
          cd server
          python -m PyInstaller ../packaging/rhythm-server.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test the bundled server
        shell: pwsh
        run: ./packaging/smoke_server.ps1

      - name: Build the installer (electron-builder, NSIS)
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v5
        with:
          name: GenerativeRhythm-Windows-Setup
          path: desktop/dist/GenerativeRhythm-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Install silently and launch the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/dist/GenerativeRhythm-Setup-*.exe | Select-Object -First 1
          Write-Host "installer: $($setup.Name) ($([math]::Round($setup.Length / 1MB)) MB)"
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "the installer exited with $($install.ExitCode)" }
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'Generative Rhythm.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'the installed app was not found under %LOCALAPPDATA%\Programs' }
          Write-Host "installed: $($exe.FullName)"
          node packaging/smoke_desktop.cjs client $exe.FullName desktop/dist/smoke

      - name: Collect the logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/dist/smoke | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'grg-smoke/*.log') desktop/dist/smoke -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $env:APPDATA 'Generative Rhythm/server.log') desktop/dist/smoke/desktop-server.log -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: windows-smoke-test
          path: desktop/dist/smoke
          if-no-files-found: ignore
          retention-days: 30
