name: Desktop app (Windows)

# Builds the Windows installer: the client, the analysis server bundled with PyInstaller (it has to
# run on Windows to produce a Windows executable), then the Electron NSIS installer. The installer is
# then installed silently and the installed app is launched once as a smoke test. One edition: the
# core analysis, with Mapperatorinator (the chart generator, docs/MAPPERATORINATOR.md) set up by the
# app on first use.
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'client/e2e/**'
      - '**/*.test.ts'
      - 'server/tests/**'
      - 'design-mockups/**'

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      SETUP_PREFIX: GenerativeRhythm-Setup
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json

      - name: Build the client
        working-directory: client
        run: |
          npm ci
          npm run build

      # Mapperatorinator's source and slider's (its .osu parser) at the commits config/mapper.json
      # pins, bundled so the app sets its runtime up without GitHub (docs/MAPPERATORINATOR.md)
      - name: Fetch Mapperatorinator's source
        run: |
          # (Windows Python ends the line with \r\n: the \r goes, or git takes it as part of the commit)
          read -r src slider < <(python -c "import json; r = json.load(open('config/mapper.json'))['runtime']; print(r['source']['commit'], r['slider']['commit'])" | tr -d '\r')
          for spec in "mapperatorinator OliBomby/Mapperatorinator $src" "slider OliBomby/slider $slider"; do
            set -- $spec
            git init -q "packaging/vendor/$1"
            git -C "packaging/vendor/$1" fetch -q --depth 1 "https://github.com/$2.git" "$3"
            git -C "packaging/vendor/$1" checkout -q FETCH_HEAD
          done
          rm -rf packaging/vendor/mapperatorinator/.git packaging/vendor/slider/.git
          du -sh packaging/vendor/*

      - name: Bundle the analysis server (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./server[build]"
          cd server
          python -m PyInstaller ../packaging/rhythm-server.spec --noconfirm --distpath dist --workpath build
          du -sh dist/rhythm-server

      - name: Smoke test the bundled server
        shell: pwsh
        run: ./packaging/smoke_server.ps1

      - name: Build the installer (electron-builder, NSIS)
        working-directory: desktop
        run: |
          npm ci
          # its tools and Electron from GitHub's release downloads, retried (one failed download fails the build)
          bash ../packaging/fetch_builder_tools.sh
          npx electron-builder --win nsis --x64 --publish never "-c.nsis.artifactName=${SETUP_PREFIX}-\${version}.\${ext}"

      - uses: actions/upload-artifact@v5
        with:
          name: GenerativeRhythm-Windows-Setup
          path: desktop/dist/${{ env.SETUP_PREFIX }}-*.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # Mapperatorinator end to end on this runner's CPU (it has no GPU) with the small model: the
      # runtime's setup (uv, Python 3.11, CPU PyTorch, its packages, the weights) and one chart of a
      # 20-second synthetic song. Informational (it downloads from PyPI, GitHub and Hugging Face): the
      # app runs it on an NVIDIA GPU (docs/MAPPERATORINATOR.md). The runtime it leaves is what the
      # installed app's smoke test below makes its chart with.
      - name: Mapperatorinator on the CPU (setup and one chart)
        continue-on-error: true
        timeout-minutes: 60
        env:
          GRG_MAPPER_ALLOW_CPU: '1'
          GRG_MAPPER_MODEL: v32-mini
          GRG_MAPPER_HOME: ${{ runner.temp }}/grg-mapper
        run: |
          exe=server/dist/rhythm-server/rhythm-server.exe
          "$exe" mapper status
          ok=0
          "$exe" mapper setup && "$exe" mapper generate --seconds 20 --mode 7K+1S --difficulty HARD && ok=1
          mkdir -p "$RUNNER_TEMP/grg-smoke"
          cp "$GRG_MAPPER_HOME/setup.log" "$GRG_MAPPER_HOME/worker.log" "$RUNNER_TEMP/grg-smoke/" 2>/dev/null || true
          if [ "$ok" != 1 ]; then tail -n 80 "$GRG_MAPPER_HOME/setup.log" "$GRG_MAPPER_HOME/worker.log" 2>/dev/null; exit 1; fi

      - name: Install silently and launch the installed app
        shell: pwsh
        env:
          # the CPU step's runtime, where it was set up: the app makes its chart with it
          GRG_MAPPER_ALLOW_CPU: '1'
          GRG_MAPPER_MODEL: v32-mini
          GRG_MAPPER_HOME: ${{ runner.temp }}/grg-mapper
        run: |
          $setup = Get-ChildItem "desktop/dist/$($env:SETUP_PREFIX)-*.exe" | Select-Object -First 1
          Write-Host "installer: $($setup.Name) ($([math]::Round($setup.Length / 1MB)) MB)"
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "the installer exited with $($install.ExitCode)" }
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'Generative Rhythm.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'the installed app was not found under %LOCALAPPDATA%\Programs' }
          Write-Host "installed: $($exe.FullName)"
          node packaging/smoke_desktop.cjs client $exe.FullName desktop/dist/smoke

      - name: Collect the logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/dist/smoke | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'grg-smoke/*.log') desktop/dist/smoke -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $env:APPDATA 'Generative Rhythm/server.log') desktop/dist/smoke/desktop-server.log -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: windows-smoke-test
          path: desktop/dist/smoke
          if-no-files-found: ignore
          retention-days: 30
