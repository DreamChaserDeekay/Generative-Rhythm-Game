name: Desktop app (Windows)

# Builds the Windows installers: the client, the analysis server bundled with PyInstaller (it has to
# run on Windows to produce a Windows executable), then the Electron NSIS installer. Each installer is
# then installed silently and the installed app is launched once as a smoke test. Two editions: core
# (the core analysis only) and ml (PyTorch CPU, Demucs, beat_this, basic-pitch ONNX; a 347 MB
# installer; packaging/ml_torch.txt pins PyTorch).
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'client/e2e/**'
      - '**/*.test.ts'
      - 'server/tests/**'

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        edition: [core, ml]
    name: windows (${{ matrix.edition }})
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GRG_EDITION: ${{ matrix.edition }}
      SETUP_PREFIX: ${{ matrix.edition == 'ml' && 'GenerativeRhythm-ML-Setup' || 'GenerativeRhythm-Setup' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json

      - name: Build the client
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Bundle the analysis server (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          if [ "$GRG_EDITION" = ml ]; then
            python -m pip install -r packaging/ml_torch.txt --index-url https://download.pytorch.org/whl/cpu
            python -m pip install -e "./server[build,ml]"
            # its ONNX model on Python 3.12; its declared TensorFlow has no 3.12 wheels (server/pyproject.toml)
            python -m pip install --no-deps "basic-pitch>=0.4"
          else
            python -m pip install -e "./server[build]"
          fi
          cd server
          python -m PyInstaller ../packaging/rhythm-server.spec --noconfirm --distpath dist --workpath build
          du -sh dist/rhythm-server

      - name: Smoke test the bundled server
        shell: pwsh
        run: |
          if ($env:GRG_EDITION -eq 'ml') { ./packaging/smoke_server.ps1 -ExpectML } else { ./packaging/smoke_server.ps1 }

      - name: Build the installer (electron-builder, NSIS)
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --win nsis --x64 --publish never "-c.nsis.artifactName=${SETUP_PREFIX}-\${version}.\${ext}"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.edition == 'ml' && 'GenerativeRhythm-Windows-ML-Setup' || 'GenerativeRhythm-Windows-Setup' }}
          path: desktop/dist/${{ env.SETUP_PREFIX }}-*.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Install silently and launch the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem "desktop/dist/$($env:SETUP_PREFIX)-*.exe" | Select-Object -First 1
          Write-Host "installer: $($setup.Name) ($([math]::Round($setup.Length / 1MB)) MB)"
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "the installer exited with $($install.ExitCode)" }
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'Generative Rhythm.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'the installed app was not found under %LOCALAPPDATA%\Programs' }
          Write-Host "installed: $($exe.FullName)"
          node packaging/smoke_desktop.cjs client $exe.FullName desktop/dist/smoke

      - name: Collect the logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/dist/smoke | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'grg-smoke/*.log') desktop/dist/smoke -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $env:APPDATA 'Generative Rhythm/server.log') desktop/dist/smoke/desktop-server.log -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: windows-smoke-test-${{ matrix.edition }}
          path: desktop/dist/smoke
          if-no-files-found: ignore
          retention-days: 30
